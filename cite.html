<title>La Cité perchée</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Layout: la butte de Laon en scène vivante (haut / gauche), registre du bailli en parchemin sombre (bas / droite). Look sombre assumé, un seul thème. */
:root {
  --night: #0d0b0a;
  --panel: #171210;
  --panel-2: #211a16;
  --edge: #3a2f27;
  --gold: #e0ad4a;
  --gold-dim: #9c7a3c;
  --ember: #ff8a3d;
  --parch: #eadbb3;
  --parch-deep: #d6c08d;
  --ink: #2a1d12;
  --bone: #eadfc6;
  --muted: #a8977c;
  --blood: #7d2418;
  --mist: #9fd6e0;
  --good: #8fcf7a;
  --f-title: "Cinzel Decorative", "Cinzel", Georgia, serif;
  --f-head: "Cinzel", Georgia, serif;
  --f-body: "IM Fell English", Garamond, Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--night); color: var(--bone); font-family: var(--f-body); overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* Bandeau du trésor */
#top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(#1c1613, #120e0c);
  border-bottom: 1px solid var(--edge);
}
.brand { font-family: var(--f-title); color: var(--gold); font-size: 17px; letter-spacing: .02em; white-space: nowrap; }
.brand small { display: block; font-family: var(--f-head); font-size: 11px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }
.treasury { text-align: right; min-width: 0; }
.treasury .amt { font-family: var(--f-head); font-weight: 700; font-size: clamp(20px, 5vw, 28px); color: #fff1cf; font-variant-numeric: tabular-nums; line-height: 1.1; }
.treasury .amt span { font-size: .6em; color: var(--gold); margin-left: 4px; }
.treasury .rate { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.treasury .rate b { color: var(--good); font-weight: normal; }

/* Corps : scène + registre */
#main { display: grid; grid-template-rows: minmax(200px, 42%) minmax(0, 1fr); min-height: 0; }
@media (min-width: 900px) { #main { grid-template-rows: none; grid-template-columns: minmax(0, 1.35fr) minmax(360px, 1fr); } }

#sceneWrap { position: relative; min-height: 0; border: 0; padding: 0; margin: 0; background: #000; cursor: pointer; display: block; width: 100%; height: 100%; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hint {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  font-family: var(--f-head); font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
  color: #fff3d6; background: rgba(13,11,10,.6); border: 1px solid var(--gold-dim); border-radius: 20px; padding: 6px 14px;
  pointer-events: none; white-space: nowrap; animation: breathe 2.4s ease-in-out infinite;
}
@keyframes breathe { 50% { opacity: .55; } }
#toasts { position: absolute; top: 10px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toast { font-family: var(--f-head); font-size: 13px; letter-spacing: .06em; background: rgba(23,18,16,.92); border: 1px solid var(--gold); color: #fff1cf; padding: 6px 12px; border-radius: 4px; max-width: 100%; text-align: center; animation: drop .3s ease-out; }
@keyframes drop { from { transform: translateY(-8px); opacity: 0; } }
#buffs { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 10px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; pointer-events: none; }
.buff { font-family: var(--f-head); font-size: 12px; background: rgba(23,18,16,.85); border: 1px solid var(--mist); color: var(--mist); border-radius: 3px; padding: 3px 8px; font-variant-numeric: tabular-nums; }

/* Registre */
#panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--edge); border-top: 1px solid var(--edge); }
#tabs { display: flex; border-bottom: 1px solid var(--edge); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
#tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 11px 6px 9px; font-family: var(--f-head); font-size: 13px; letter-spacing: .08em; color: var(--muted); cursor: pointer; position: relative; }
#tabs button[aria-selected="true"] { color: var(--gold); border-bottom-color: var(--gold); }
#tabs .dot { position: absolute; top: 7px; margin-left: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--ember); }
.qty { display: flex; gap: 6px; align-items: center; justify-content: flex-end; padding: 8px 16px 0; font-family: var(--f-head); font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.qty button { background: var(--panel-2); border: 1px solid var(--edge); border-radius: 3px; padding: 3px 9px; cursor: pointer; font-family: var(--f-head); font-size: 12px; }
.qty button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
#list {
  flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
  padding-block: 10px 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.row {
  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  text-align: left; width: 100%; background: var(--panel-2); border: 1px solid var(--edge); border-radius: 4px;
  padding: 9px 12px 9px 9px; cursor: pointer; transition: border-color .15s, background .15s;
}
.row:hover:not(:disabled) { border-color: var(--gold-dim); background: #2a211b; }
.row:disabled { cursor: default; }
.row.poor .cost { color: #b0574a; }
.row.poor .lettrine { filter: grayscale(.7) brightness(.75); }
.lettrine {
  width: 44px; height: 44px; display: grid; place-items: center; border-radius: 3px;
  font-family: var(--f-title); font-size: 24px; color: var(--gold);
  background: radial-gradient(circle at 30% 25%, #9b3a26, var(--blood) 60%, #4a140c);
  border: 1px solid var(--gold-dim); box-shadow: inset 0 0 0 2px rgba(0,0,0,.35);
}
.lettrine.era1 { background: radial-gradient(circle at 30% 25%, #3d5f8a, #233c5e 60%, #10203a); }
.lettrine.era2 { background: radial-gradient(circle at 30% 25%, #4e7a46, #2c4d28 60%, #142a12); }
.lettrine.era3 { background: radial-gradient(circle at 30% 25%, #6a4a8a, #42295e 60%, #22123a); }
.row .txt { min-width: 0; }
.row .name { font-family: var(--f-head); font-size: 15px; color: #fff1cf; letter-spacing: .03em; }
.row .desc { font-size: 14px; color: var(--muted); line-height: 1.3; margin-top: 2px; }
.row .meta { font-size: 13px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
.row .meta b { color: var(--good); font-weight: normal; }
.row .side { text-align: right; font-variant-numeric: tabular-nums; }
.row .owned { font-family: var(--f-head); font-size: 22px; color: var(--bone); line-height: 1; }
.row .cost { font-family: var(--f-head); font-size: 13px; color: var(--gold); margin-top: 4px; white-space: nowrap; }
.row.locked { opacity: .5; cursor: default; }
.row.locked .lettrine { background: #2a2420; color: var(--muted); }

.monument { border-color: var(--gold-dim); background: linear-gradient(180deg, #2a2016, #1f1813); }
.monument .name { color: var(--gold); }
.monument .eyebrow { font-family: var(--f-head); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-dim); }
.prog { height: 6px; border-radius: 3px; background: #0e0a08; border: 1px solid var(--edge); margin-top: 6px; overflow: hidden; }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); }

.section-title { font-family: var(--f-head); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-dim); margin: 8px 0 0; }
.chron { background: var(--panel-2); border: 1px solid var(--edge); border-radius: 4px; padding: 12px 14px; }
.chron h3 { font-family: var(--f-head); font-size: 15px; color: var(--gold); margin: 0 0 4px; }
.chron p { margin: 0; font-size: 15px; line-height: 1.45; }
.chron.locked h3 { color: var(--muted); }
.chron.locked p { color: var(--muted); font-style: italic; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.stat { background: var(--panel-2); border: 1px solid var(--edge); border-radius: 4px; padding: 8px 10px; }
.stat span { display: block; font-family: var(--f-head); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stat b { font-family: var(--f-head); font-size: 17px; color: #fff1cf; font-weight: 500; font-variant-numeric: tabular-nums; }
.btn { background: var(--panel-2); border: 1px solid var(--gold-dim); color: var(--gold); border-radius: 4px; padding: 9px 12px; font-family: var(--f-head); font-size: 13px; letter-spacing: .06em; cursor: pointer; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.danger { border-color: #6b2a20; color: #d98c7e; }
.empty { color: var(--muted); font-style: italic; font-size: 15px; padding: 8px 2px; }

#stance { display: flex; align-items: center; gap: 6px; padding-block: 10px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--edge); }
@media (max-width: 520px) { #stance .lbl { display: none; } }
#stance .lbl { font-family: var(--f-head); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
#stance button { flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--panel-2); border: 1px solid var(--edge); border-radius: 3px; padding: 6px 8px; font-family: var(--f-head); font-size: 12px; letter-spacing: .04em; cursor: pointer; color: var(--muted); }
#stance button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); background: #2a2016; }
#stance button:disabled { opacity: .5; cursor: default; }
.qty .mode { display: flex; margin-right: auto; }
.qty .mode button { border-radius: 0; }
.qty .mode button:first-child { border-radius: 3px 0 0 3px; }
.qty .mode button:last-child { border-radius: 0 3px 3px 0; border-left: 0; }
.qty .mode button[data-m="sell"][aria-pressed="true"] { border-color: #b0574a; color: #e39a8c; }
.row.selling .cost { color: #e39a8c; }
.favor { border-width: 1px; border-style: solid; }
.favor .rar { font-family: var(--f-head); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
.favor.sold { opacity: .4; }
.buff.def { border-color: #d98c7e; color: #f0b3a6; }
.buff .bar { display: block; height: 2px; background: currentColor; margin-top: 2px; opacity: .7; }

.hbtn { background: none; border: 1px solid var(--edge); border-radius: 3px; padding: 5px 9px; font-family: var(--f-head); font-size: 11px; letter-spacing: .08em; color: var(--muted); cursor: pointer; margin-left: auto; }
#quest { display: flex; align-items: center; gap: 10px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--edge); background: #1b1512; }
#quest .qtxt { flex: 1; min-width: 0; font-size: 14px; }
#quest .qlbl { display: block; font-family: var(--f-head); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-dim); }
#quest #qName { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#quest .prog { margin-top: 4px; }
#quest .btn { padding: 6px 10px; animation: breathe 1.6s ease-in-out infinite; }
.syn { color: var(--mist); }
.syn2 { color: var(--muted); font-size: 12px; font-style: italic; }
.expe { border-color: #3d5f8a; }
.owned-node { border-color: var(--gold-dim); opacity: .8; }
.achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.ach { background: var(--panel-2); border: 1px solid var(--edge); border-radius: 4px; padding: 7px 9px; font-size: 13px; color: var(--muted); min-width: 0; }
.ach b { display: block; font-family: var(--f-head); font-size: 12px; font-weight: 500; color: var(--muted); }
.ach.on { border-color: var(--gold-dim); color: var(--bone); }
.ach.on b { color: var(--gold); }

#title { position: fixed; inset: 0; z-index: 28; display: grid; place-items: end center; background: #120c10; }
#title[hidden] { display: none; }
#tcv { position: absolute; inset: 0; width: 100%; height: 100%; }
#timg { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; object-position: 62% 30%; opacity: 0; transition: opacity 1.2s ease; }
#timg.ready { opacity: 1; }
.tbox { position: relative; text-align: center; padding-block: 0 max(48px, calc(env(safe-area-inset-bottom, 0px) + 32px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); width: 100%; background: linear-gradient(transparent, rgba(10,6,8,.85) 45%); }
.tkick { font-family: var(--f-head); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #f2c27a; margin: 0 0 6px; }
#title h1 { font-family: var(--f-title); font-size: clamp(38px, 9vw, 76px); line-height: 1; margin: 0 0 12px; color: #fff1cf; text-shadow: 0 2px 24px rgba(255,170,90,.45); text-wrap: balance; }
.tsub { font-size: 18px; color: var(--bone); margin: 0 auto 22px; max-width: 34ch; }
.tgo { font-family: var(--f-head); font-size: 16px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); background: linear-gradient(#f2d08a, #d9a441); border: 1px solid #8a6a3a; border-radius: 4px; padding: 14px 30px; cursor: pointer; box-shadow: 0 8px 30px rgba(224,173,74,.35); }
#cine { position: fixed; inset: 0; z-index: 27; display: grid; place-items: center; background: rgba(5,3,2,.55); pointer-events: auto; }
#cine[hidden] { display: none; }
#cine .bar { position: absolute; left: 0; right: 0; height: 12vh; background: #000; }
#cine .bar.top { top: 0; } #cine .bar.bot { bottom: 0; }
#cineLines { text-align: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#cineLines p { font-family: var(--f-body); font-style: italic; font-size: clamp(20px, 4.5vw, 30px); color: #fff1cf; margin: 0 0 14px; opacity: 0; animation: cinein 1.2s ease-out forwards; text-shadow: 0 2px 12px #000; }
@keyframes cinein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#cineSkip { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(12vh + 12px); z-index: 1; }
#exp { position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column; background: #050302; }
#exp[hidden] { display: none; }
.xhud { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: #171210; border-bottom: 1px solid var(--edge); font-family: var(--f-head); font-size: 13px; letter-spacing: .05em; }
.xhud .xt { color: var(--gold); flex: 1; min-width: 0; }
.xbar { display: inline-block; vertical-align: middle; width: 90px; height: 9px; border: 1px solid var(--edge); border-radius: 5px; overflow: hidden; background: #0e0a08; }
.xbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--blood), var(--ember), #ffd27a); }
.xg b { color: var(--gold); }
#xstage { position: relative; flex: 1; min-height: 0; }
#xcv { position: absolute; inset: 0; width: 100%; height: 100%; }
#xpad { position: absolute; display: none; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); gap: 4px; opacity: .85; user-select: none; -webkit-user-select: none; }
#xpad button { font-size: 20px; padding: 0; background: rgba(36,28,23,.75); border: 1px solid var(--edge); border-radius: 4px; touch-action: none; color: var(--bone); }
#xpad [data-d="up"] { grid-area: 1 / 2; } #xpad [data-d="left"] { grid-area: 2 / 1; } #xpad [data-d="right"] { grid-area: 2 / 3; } #xpad [data-d="down"] { grid-area: 3 / 2; }
@media (pointer: coarse) { #xpad { display: grid; } }
@media (prefers-reduced-motion: reduce) { #cineLines p { animation: none; opacity: 1; } #quest .btn { animation: none; } }

.resl { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.resm { color: #c8a878; }
.mreq span { color: var(--good); } .mreq span.lack { color: #d98c7e; }
#tabs button { font-size: 12px; letter-spacing: .04em; padding-left: 2px; padding-right: 2px; }
.trade h3 { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tr { font-family: var(--f-head); font-size: 12px; } .tr.up { color: var(--good); } .tr.down { color: #d98c7e; }
.tbtns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tcd { font-family: var(--f-head); font-size: 13px; color: var(--mist); }
.lb { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-variant-numeric: tabular-nums; }
.lb li { display: flex; gap: 8px; align-items: baseline; font-size: 15px; } .lb li span { color: var(--muted); width: 1.6em; } .lb li b { margin-left: auto; color: var(--gold); font-weight: normal; }
.lb li.me { color: #fff1cf; }

.row { box-sizing: border-box; }
.row.item { cursor: default; }
.row.item .lettrine { background: radial-gradient(circle at 30% 25%, #3a2c22, #1e1612 70%); }
.row.item .rar { font-family: var(--f-head); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }

/* Parchemin */
#modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,3,2,.72); z-index: 30; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#modal[hidden] { display: none; }
.parch {
  width: min(520px, 100%); max-height: 100%; overflow-y: auto; color: var(--ink);
  background: radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.35), transparent 55%), radial-gradient(ellipse at 80% 90%, rgba(120,80,30,.25), transparent 60%), var(--parch);
  border: 2px solid var(--parch-deep); outline: 1px solid #8a6a3a; outline-offset: -8px; border-radius: 6px;
  box-shadow: 0 20px 60px rgba(0,0,0,.7), inset 0 0 40px rgba(110,70,20,.35);
  padding: 28px 26px 24px; animation: unroll .35s ease-out;
}
@keyframes unroll { from { transform: scaleY(.6); opacity: 0; } }
.parch .eyebrow { font-family: var(--f-head); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #7a4f1f; margin: 0 0 6px; }
.parch h2 { font-family: var(--f-title); font-size: clamp(22px, 5vw, 30px); line-height: 1.15; margin: 0 0 14px; text-wrap: balance; color: #3a2210; }
.parch p { font-size: 18px; line-height: 1.5; margin: 0 0 12px; }
.parch .note { font-style: italic; color: #5b4128; }
.parch .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.parch .choices button { font-family: var(--f-head); font-size: 15px; letter-spacing: .08em; background: var(--ink); color: var(--gold); border: 1px solid #2a1b0f; border-radius: 4px; padding: 11px 14px; cursor: pointer; }
.parch .choices button.sec { background: #3a2717; color: var(--parch); font-family: var(--f-body); letter-spacing: 0; font-size: 17px; }
@media (prefers-reduced-motion: reduce) { #hint, .parch, .toast { animation: none; } }
</style>

<div id="app">
  <header id="top">
    <div class="brand">La Cité perchée<small id="eraLabel">Ère des Carolingiens</small></div>
    <button type="button" id="btnSound" class="hbtn" aria-pressed="true">Son : oui</button>
    <div class="treasury">
      <div class="amt" id="amt">0<span>deniers</span></div>
      <div class="rate"><b id="pps">0</b> par seconde · <span id="perClick">1</span> par toucher</div>
      <div class="resl" id="resLine" hidden></div>
    </div>
  </header>
  <div id="main">
    <button id="sceneWrap" type="button" aria-label="Toucher la cité pour récolter des deniers">
      <canvas id="scene"></canvas>
      <div id="hint">Touche la cité</div>
      <div id="toasts" aria-live="polite"></div>
      <div id="buffs"></div>
    </button>
    <section id="panel">

  const cur = { k, h, left: h.time, hits: 0, fx: 0, rats: [] };
  if (k === "eboulement") cur.fx = 0.5 + (Math.random() < 0.5 ? -1 : 1) * 0.22;

}
function hazardPos(g, cur, r) {
  const span = g.pr - g.pl;

  if (cur.k === "incendie") return { x: g.pl + span * cur.fx, y: g.py - 8 * g.u };

}

    for (const r of cur.rats) { if (!r.alive) continue; const p = hazardPos(g, cur, r); if (Math.hypot(x - p.x, y - p.y) < rad) { r.alive = false; cur.hits++; Snd.squeak(); burst(p.x, p.y, "200,190,170"); checkHazard(); return true; } }

}

}

}
function drawHazard(g, t) {
  const cur = hazard.cur; if (!cur) return; const u = g.u;

const siege = { phase: null, left: 0, slots: [], queued: false };
const SIEGE_F = [0.22, 0.38, 0.54, 0.7, 0.86];

function updateSiege(dt) {

    siege.queued = false; siege.phase = "prep"; siege.left = 35; siege.slots = SIEGE_F.map(f => ({ f, type: null, cd: 0 }));

  }

}
function siegeFire(dt, g) {
  if (siege.phase !== "fight") return; const D = Math.max(5, defense());

    if (!s.type) continue; const T = DEFENDERS[s.type]; s.cd -= dt; if (s.cd > 0) continue;
    const tg = raid.foes.filter(f => f.hp > 0 && f.f >= 0 && Math.abs(f.f - s.f) < 0.25).sort((a, b) => Math.abs(a.f - s.f) - Math.abs(b.f - s.f))[0];
    if (!tg) continue; s.cd = T.cd; const p = slotPos(g, s);
    raid.arrows.push({ x0: p.x, y0: p.y, foe: tg, t: 0, dmg: D * T.mult, rock: !!T.aoe }); if (T.aoe) Snd.hit(); else Snd.arrow();

}
function endSiege(ok) {
  siege.phase = null; G.siegeDone.push(G.era);
  if (ok) { G.siegeWins++; Snd.fanfare(); lootQueue.push(() => dropItem("Grand siège", 2, 3)); modalShow({ eyebrow: "Grand siège", title: "Laon tient bon", body: `<p>L'armée se replie dans la plaine. La renommée de la cité perchée grandit : <b>+10 % de production pour toujours</b>.</p>`, choices: [{ label: "Célébrer", on: modalHide }] }); }

}
function hitSlot(x, y) {
  if (!siege.phase) return false; const g = geom();
  for (const s of siege.slots) {
    const p = slotPos(g, s); if (Math.hypot(x - p.x, y - p.y) > Math.max(24, 12 * g.u)) continue;
    if (siege.phase !== "prep") return true;
    modalShow({ eyebrow: "Poste de défense", title: s.type ? `Poste occupé : ${DEFENDERS[s.type].name}` : "Poste libre", body: `<p>Choisis qui tient ce poste pendant le siège.</p>`,
      choices: [...Object.entries(DEFENDERS).map(([k, T]) => ({ label: `${T.name} (−${fmt(secs(T.k))})`, on: () => { const cst = secs(T.k); if (G.deniers >= cst) { G.deniers -= cst; s.type = k; Snd.coin(); } else toast("Pas assez de deniers"); modalHide(); } })), { label: "Laisser libre", sec: true, on: modalHide }] });

function drawSiege(g, t) {
  if (!siege.phase) return; const u = g.u;
  for (const s of siege.slots) {
    const p = slotPos(g, s);
    if (siege.phase === "prep") { c.strokeStyle = `rgba(224,173,74,${0.6 + 0.4 * Math.sin(t * 4)})`; c.lineWidth = 2; c.beginPath(); c.arc(p.x, p.y, Math.max(10, 7 * u), 0, Math.PI * 2); c.stroke(); }
    if (s.type === "archers") { c.fillStyle = "#2a3e5c"; c.fillRect(p.x - 1.5 * u, p.y - 6 * u, 3 * u, 6 * u); c.beginPath(); c.arc(p.x, p.y - 7.5 * u, 1.5 * u, 0, Math.PI * 2); c.fill(); c.strokeStyle = "#7a5634"; c.lineWidth = Math.max(1, u * 0.5); c.beginPath(); c.arc(p.x + 2 * u, p.y - 4 * u, 3 * u, -Math.PI / 2, Math.PI / 2); c.stroke(); }

    else if (siege.phase === "prep") { c.fillStyle = "rgba(224,173,74,.9)"; c.font = `700 ${Math.round(10 + u * 2)}px Cinzel, serif`; c.textAlign = "center"; c.fillText("+", p.x, p.y + 4 * u); }

/* ================= Défi de la semaine & classement partagé ================= */
const WEEK_KINDS = [
  { name: "Pillards abattus", v: () => G.foesSlain }, { name: "Touchers", v: () => G.clicks }, { name: "Feux follets attrapés", v: () => G.wispsCaught },
  { name: "Incidents maîtrisés", v: () => G.stats.events }, { name: "Coups de maître", v: () => G.stats.crits }
];
const weekId = () => Math.floor((Date.now() - Date.UTC(2024, 0, 1)) / 604800000);
const weekKind = () => WEEK_KINDS[weekId() % WEEK_KINDS.length];
function weekScore() { const id = weekId(); if (!G.week || G.week.id !== id) G.week = { id, base: weekKind().v() }; return Math.max(0, weekKind().v() - G.week.base); }
const LB = { db: null, user: null, uid: null, rows: [], names: {}, state: "loading", lastSent: -1, wk: -1, unsub: null, err: null };
function lbSubscribe() {
  if (!LB.db) return; if (LB.unsub) LB.unsub(); LB.wk = weekId();
  LB.unsub = LB.db.collection("lb").where("week", "==", LB.wk).orderBy("score", "desc").limit(10).onSnapshot(snap => {
    LB.rows = snap.docs.map(d => ({ id: d.id, ...(d.data() || {}) })); LB.state = "ok";
    const ids = LB.rows.map(r => r.id); if (ids.length && LB.user) LB.user.profiles(ids).then(ps => { for (const id of ids) LB.names[id] = (ps[id] && ps[id].name) || "Quelqu'un"; if (tab === "c") render(); }).catch(() => {});
    if (tab === "c") render();
  }, () => { LB.state = "off"; if (tab === "c") render(); });
}
async function lbInit() {
  const timer = setTimeout(() => { if (LB.state === "loading") { LB.state = "off"; if (tab === "c") render(); } }, 10000);
  try {
    for (let i = 0; i < 10 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 300));
    if (!(window.claude && window.claude.use)) { LB.state = "off"; clearTimeout(timer); return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) { LB.state = "off"; clearTimeout(timer); if (tab === "c") render(); return; }
    LB.db = db; LB.user = user; LB.uid = await user.id(); clearTimeout(timer); lbSubscribe();
  } catch (e) { LB.state = "off"; clearTimeout(timer); }
}
function lbTick() {
  if (!LB.db || !LB.uid || !isU("week")) return;
  if (LB.wk !== weekId()) lbSubscribe();
  const s = weekScore(); if (s === LB.lastSent) return; LB.lastSent = s;
  LB.db.collection("lb").doc(LB.uid).set({ week: weekId(), kind: weekKind().name, score: s, at: Date.now() }).then(() => { LB.err = null; }).catch(e => { LB.err = e && e.code; });
}

let visitMode = false;
function readFiche(id) {
  const f = FICHES[id]; if (!f) return;
  if (!G.read.includes(id)) G.read.push(id);
  modalShow({ eyebrow: "Visite de Laon", title: f.title, body: `<p>${f.text}</p>${hasC("champfleury") ? `<p class="note">Fiches lues : ${G.read.length} (+${G.read.length} % de production grâce à Champfleury).</p>` : ""}`, choices: [{ label: "Continuer la visite", on: modalHide }] });
}
function availFiches() { const ids = []; for (const b of BLD) if (owned(b.id) > 0 && FICHES[b.id] && !ids.some(i => FICHES[i] === FICHES[b.id])) ids.push(b.id); for (let i = 0; i < Math.min(G.era, 3); i++) ids.push("m" + i); return ids; }
function hotspots(g) {
  const span = g.pr - g.pl, u = g.u, h = [];
  for (let i = 0; i < Math.min(G.era, 3); i++) { const [x, y] = plat(g, MON_POS[i].fx, MON_POS[i].d); h.push({ id: "m" + i, x, y: y - [14, 20, 8][i] * u }); }
  if (owned("commanderie")) { const [x, y] = plat(g, 0.3, 0.42); h.push({ id: "commanderie", x, y: y - 8 * u }); }
  if (owned("musee")) { const [x, y] = plat(g, 0.74, 0.5); h.push({ id: "musee", x, y: y - 8 * u }); }
  if (owned("gare")) h.push({ id: "gare", x: pomaEnds(g).gx, y: g.y0 - 6 * u });
  if (owned("creute")) for (let i = 0; i < Math.min(2, owned("creute")); i++) { const [x, y] = bp(g, CREUTES[i][0], CREUTES[i][1]); h.push({ id: "creute", x, y }); }
  if (owned("porte")) h.push({ id: "porte", x: g.pl, y: g.py - 6 * u });
  if (owned("boeufs")) { const [x, y] = bp(g, 0.13, 0.7); h.push({ id: "boeufs", x, y }); }
  if (owned("masure")) h.push({ id: "masure", x: g.pl + span * 0.6, y: g.py - 6 * u });
  return h;
}
function hitVisit(x, y) {
  if (!visitMode) return false; const g = geom(); let best = null, bd = 50;
  for (const p of hotspots(g)) { const d = Math.hypot(x - p.x, y - p.y); if (d < bd) { bd = d; best = p; } }
  if (best) readFiche(best.id); else toast("Rien à visiter ici : touche un monument ou un bâtiment");
  return true;
}

function itemValue(it, rec) { return it.v * RARITIES[rec.r].m * (1 + 0.25 * (rec.n - 1)); }
function itemBonus(k) { let s = 0; for (const it of ITEMS) { const rec = G.items[it.id]; if (rec && it.k === k) s += itemValue(it, rec); } return s; }
function rollRarity(luck) { const ws = RARITIES.map((r, i) => r.w * Math.pow(1 + (luck || 0), i)); let x = Math.random() * ws.reduce((a, b) => a + b, 0); for (let i = 0; i < ws.length; i++) if ((x -= ws[i]) < 0) return i; return 0; }
function dropItem(src, luck, minR) {
  const it = ITEMS[Math.floor(Math.random() * ITEMS.length)], r = Math.max(minR || 0, rollRarity(luck)), R0 = RARITIES[r];
  const cur = G.items[it.id], fresh0 = !cur, upgraded = cur && r > cur.r;
  if (cur) { cur.n++; if (r > cur.r) cur.r = r; } else G.items[it.id] = { r, n: 1 };
  const rec = G.items[it.id], what = fresh0 ? "Nouveau trésor" : upgraded ? "Trésor amélioré" : "Trésor en double (+25 %)";
  if (r >= 3) {

    if (modal.hidden) show(); else lootQueue.push(show);
  } else { Snd.pop(); toast(`${src} : ${it.name} (${R0.name})`, R0.color); }
  if (tab === "t") render();
}
const lootQueue = [];
const maybeDrop = (src, chance, luck, minR) => { if (Math.random() < chance) dropItem(src, luck, minR); };
function renderReliquary() {
  const own = ITEMS.filter(it => G.items[it.id]);
  list.appendChild(el(`<p class="section-title">Reliquaire · ${own.length}/${ITEMS.length} trésors</p>`));
  if (!own.length) { list.appendChild(el(`<p class="empty">Aucun trésor encore. Feux follets, chefs pillards, expéditions, caravanes et incidents peuvent en laisser. Cinq raretés : ${RARITIES.map(r => `<span style="color:${r.color}">${r.name}</span>`).join(", ")}.</p>`)); return; }
  own.sort((a, b) => G.items[b.id].r - G.items[a.id].r).forEach(it => {

  });
}
