<title>La Cité perchée</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Layout: la butte de Laon en scène vivante (haut / gauche), registre du bailli en parchemin sombre (bas / droite). Look sombre assumé, un seul thème. */
:root {
  --night: #0d0b0a;
  --panel: #171210;
  --panel-2: #211a16;
  --edge: #3a2f27;
  --gold: #e0ad4a;
  --gold-dim: #9c7a3c;
  --ember: #ff8a3d;
  --parch: #eadbb3;
  --parch-deep: #d6c08d;
  --ink: #2a1d12;
  --bone: #eadfc6;
  --muted: #a8977c;
  --blood: #7d2418;
  --mist: #9fd6e0;
  --good: #8fcf7a;
  --f-title: "Cinzel Decorative", "Cinzel", Georgia, serif;
  --f-head: "Cinzel", Georgia, serif;
  --f-body: "IM Fell English", Garamond, Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--bone); font-family: var(--f-body); overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* Bandeau du trésor */
#top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(#1c1613, #120e0c);
  border-bottom: 1px solid var(--edge);
}
.brand { font-family: var(--f-title); color: var(--gold); font-size: 17px; letter-spacing: .02em; white-space: nowrap; }
.brand small { display: block; font-family: var(--f-head); font-size: 11px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }
.treasury { text-align: right; min-width: 0; }
.treasury .amt { font-family: var(--f-head); font-weight: 700; font-size: clamp(20px, 5vw, 28px); color: #fff1cf; font-variant-numeric: tabular-nums; line-height: 1.1; }
.treasury .amt span { font-size: .6em; color: var(--gold); margin-left: 4px; }
.treasury .rate { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.treasury .rate b { color: var(--good); font-weight: normal; }

/* Corps : scène + registre */
#main { display: grid; grid-template-rows: minmax(200px, 42%) minmax(0, 1fr); min-height: 0; }
@media (min-width: 900px) { #main { grid-template-rows: none; grid-template-columns: minmax(0, 1.35fr) minmax(360px, 1fr); } }

#sceneWrap { position: relative; min-height: 0; border: 0; padding: 0; margin: 0; background: #000; cursor: pointer; display: block; width: 100%; height: 100%; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hint {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  font-family: var(--f-head); font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
  color: #fff3d6; background: rgba(13,11,10,.6); border: 1px solid var(--gold-dim); border-radius: 20px; padding: 6px 14px;
  pointer-events: none; white-space: nowrap; animation: breathe 2.4s ease-in-out infinite;
}
@keyframes breathe { 50% { opacity: .55; } }
#toasts { position: absolute; top: 10px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toast { font-family: var(--f-head); font-size: 13px; letter-spacing: .06em; background: rgba(23,18,16,.92); border: 1px solid var(--gold); color: #fff1cf; padding: 6px 12px; border-radius: 4px; max-width: 100%; text-align: center; animation: drop .3s ease-out; }
@keyframes drop { from { transform: translateY(-8px); opacity: 0; } }
#buffs { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 10px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; pointer-events: none; }
.buff { font-family: var(--f-head); font-size: 12px; background: rgba(23,18,16,.85); border: 1px solid var(--mist); color: var(--mist); border-radius: 3px; padding: 3px 8px; font-variant-numeric: tabular-nums; }

/* Registre */
#panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--edge); border-top: 1px solid var(--edge); }
#tabs { display: flex; border-bottom: 1px solid var(--edge); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
#tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 11px 6px 9px; font-family: var(--f-head); font-size: 13px; letter-spacing: .08em; color: var(--muted); cursor: pointer; position: relative; }
#tabs button[aria-selected="true"] { color: var(--gold); border-bottom-color: var(--gold); }
#tabs .dot { position: absolute; top: 7px; margin-left: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--ember); }
.qty { display: flex; gap: 6px; align-items: center; justify-content: flex-end; padding: 8px 16px 0; font-family: var(--f-head); font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.qty button { background: var(--panel-2); border: 1px solid var(--edge); border-radius: 3px; padding: 3px 9px; cursor: pointer; font-family: var(--f-head); font-size: 12px; }
.qty button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
#list {
  flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
  padding-block: 10px 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.row {
  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  text-align: left; width: 100%; background: var(--panel-2); border: 1px solid var(--edge); border-radius: 4px;
  padding: 9px 12px 9px 9px; cursor: pointer; transition: border-color .15s, background .15s;
}
.row:hover:not(:disabled) { border-color: var(--gold-dim); background: #2a211b; }
.row:disabled { cursor: default; }
.row.poor .cost { color: #b0574a; }
.row.poor .lettrine { filter: grayscale(.7) brightness(.75); }
.lettrine {
  width: 44px; height: 44px; display: grid; place-items: center; border-radius: 3px;
  font-family: var(--f-title); font-size: 24px; color: var(--gold);
  background: radial-gradient(circle at 30% 25%, #9b3a26, var(--blood) 60%, #4a140c);
  border: 1px solid var(--gold-dim); box-shadow: inset 0 0 0 2px rgba(0,0,0,.35);
}
.lettrine.era1 { background: radial-gradient(circle at 30% 25%, #3d5f8a, #233c5e 60%, #10203a); }
.lettrine.era2 { background: radial-gradient(circle at 30% 25%, #4e7a46, #2c4d28 60%, #142a12); }
.lettrine.era3 { background: radial-gradient(circle at 30% 25%, #6a4a8a, #42295e 60%, #22123a); }
.row .txt { min-width: 0; }
.row .name { font-family: var(--f-head); font-size: 15px; color: #fff1cf; letter-spacing: .03em; }
.row .desc { font-size: 14px; color: var(--muted); line-height: 1.3; margin-top: 2px; }
.row .meta { font-size: 13px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
.row .meta b { color: var(--good); font-weight: normal; }
.row .side { text-align: right; font-variant-numeric: tabular-nums; }
.row .owned { font-family: var(--f-head); font-size: 22px; color: var(--bone); line-height: 1; }
.row .cost { font-family: var(--f-head); font-size: 13px; color: var(--gold); margin-top: 4px; white-space: nowrap; }
.row.locked { opacity: .5; cursor: default; }
.row.locked .lettrine { background: #2a2420; color: var(--muted); }

.monument { border-color: var(--gold-dim); background: linear-gradient(180deg, #2a2016, #1f1813); }
.monument .name { color: var(--gold); }
.monument .eyebrow { font-family: var(--f-head); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-dim); }
.prog { height: 6px; border-radius: 3px; background: #0e0a08; border: 1px solid var(--edge); margin-top: 6px; overflow: hidden; }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); }

.section-title { font-family: var(--f-head); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-dim); margin: 8px 0 0; }
.chron { background: var(--panel-2); border: 1px solid var(--edge); border-radius: 4px; padding: 12px 14px; }
.chron h3 { font-family: var(--f-head); font-size: 15px; color: var(--gold); margin: 0 0 4px; }
.chron p { margin: 0; font-size: 15px; line-height: 1.45; }
.chron.locked h3 { color: var(--muted); }
.chron.locked p { color: var(--muted); font-style: italic; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.stat { background: var(--panel-2); border: 1px solid var(--edge); border-radius: 4px; padding: 8px 10px; }
.stat span { display: block; font-family: var(--f-head); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stat b { font-family: var(--f-head); font-size: 17px; color: #fff1cf; font-weight: 500; font-variant-numeric: tabular-nums; }
.btn { background: var(--panel-2); border: 1px solid var(--gold-dim); color: var(--gold); border-radius: 4px; padding: 9px 12px; font-family: var(--f-head); font-size: 13px; letter-spacing: .06em; cursor: pointer; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.danger { border-color: #6b2a20; color: #d98c7e; }
.empty { color: var(--muted); font-style: italic; font-size: 15px; padding: 8px 2px; }

#stance { display: flex; align-items: center; gap: 6px; padding-block: 10px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--edge); }
@media (max-width: 520px) { #stance .lbl { display: none; } }
#stance .lbl { font-family: var(--f-head); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
#stance button { flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--panel-2); border: 1px solid var(--edge); border-radius: 3px; padding: 6px 8px; font-family: var(--f-head); font-size: 12px; letter-spacing: .04em; cursor: pointer; color: var(--muted); }
#stance button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); background: #2a2016; }
#stance button:disabled { opacity: .5; cursor: default; }
.qty .mode { display: flex; margin-right: auto; }
.qty .mode button { border-radius: 0; }
.qty .mode button:first-child { border-radius: 3px 0 0 3px; }
.qty .mode button:last-child { border-radius: 0 3px 3px 0; border-left: 0; }
.qty .mode button[data-m="sell"][aria-pressed="true"] { border-color: #b0574a; color: #e39a8c; }
.row.selling .cost { color: #e39a8c; }
.favor { border-width: 1px; border-style: solid; }
.favor .rar { font-family: var(--f-head); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
.favor.sold { opacity: .4; }
.buff.def { border-color: #d98c7e; color: #f0b3a6; }
.buff .bar { display: block; height: 2px; background: currentColor; margin-top: 2px; opacity: .7; }

/* Parchemin */
#modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,3,2,.72); z-index: 30; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#modal[hidden] { display: none; }
.parch {
  width: min(520px, 100%); max-height: 100%; overflow-y: auto; color: var(--ink);
  background: radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.35), transparent 55%), radial-gradient(ellipse at 80% 90%, rgba(120,80,30,.25), transparent 60%), var(--parch);
  border: 2px solid var(--parch-deep); outline: 1px solid #8a6a3a; outline-offset: -8px; border-radius: 6px;
  box-shadow: 0 20px 60px rgba(0,0,0,.7), inset 0 0 40px rgba(110,70,20,.35);
  padding: 28px 26px 24px; animation: unroll .35s ease-out;
}
@keyframes unroll { from { transform: scaleY(.6); opacity: 0; } }
.parch .eyebrow { font-family: var(--f-head); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #7a4f1f; margin: 0 0 6px; }
.parch h2 { font-family: var(--f-title); font-size: clamp(22px, 5vw, 30px); line-height: 1.15; margin: 0 0 14px; text-wrap: balance; color: #3a2210; }
.parch p { font-size: 18px; line-height: 1.5; margin: 0 0 12px; }
.parch .note { font-style: italic; color: #5b4128; }
.parch .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.parch .choices button { font-family: var(--f-head); font-size: 15px; letter-spacing: .08em; background: var(--ink); color: var(--gold); border: 1px solid #2a1b0f; border-radius: 4px; padding: 11px 14px; cursor: pointer; }
.parch .choices button.sec { background: #3a2717; color: var(--parch); font-family: var(--f-body); letter-spacing: 0; font-size: 17px; }
@media (prefers-reduced-motion: reduce) { #hint, .parch, .toast { animation: none; } }
</style>

<div id="app">
  <header id="top">
    <div class="brand">La Cité perchée<small id="eraLabel">Ère des Carolingiens</small></div>
    <div class="treasury">
      <div class="amt" id="amt">0<span>deniers</span></div>
      <div class="rate"><b id="pps">0</b> par seconde · <span id="perClick">1</span> par toucher</div>
    </div>
  </header>
  <div id="main">
    <button id="sceneWrap" type="button" aria-label="Toucher la cité pour récolter des deniers">
      <canvas id="scene"></canvas>
      <div id="hint">Touche la cité</div>
      <div id="toasts" aria-live="polite"></div>
      <div id="buffs"></div>
    </button>
    <section id="panel">
      <div id="stance" role="group" aria-label="Orientation de la cité">
        <span class="lbl">Orientation</span>
        <button type="button" data-s="main" aria-pressed="false" title="Toucher ×3, production ×0,7">Labeur</button>
        <button type="button" data-s="equi" aria-pressed="true" title="Ni bonus ni malus">Équilibre</button>
        <button type="button" data-s="intend" aria-pressed="false" title="Production ×1,35, toucher ×0,4">Intendance</button>
      </div>
      <div id="tabs" role="tablist">
        <button role="tab" id="tab-b" aria-selected="true" data-tab="b" type="button">Bâtir</button>
        <button role="tab" id="tab-u" aria-selected="false" data-tab="u" type="button">Améliorer</button>
        <button role="tab" id="tab-c" aria-selected="false" data-tab="c" type="button">Chronique</button>
      </div>
      <div class="qty" id="qty">
        <span class="mode"><button type="button" data-m="buy" aria-pressed="true">Acheter</button><button type="button" data-m="sell" aria-pressed="false">Vendre</button></span>
        <button type="button" data-q="1" aria-pressed="true">×1</button>
        <button type="button" data-q="10" aria-pressed="false">×10</button>
        <button type="button" data-q="max" aria-pressed="false">Max</button>
      </div>
      <div id="list" role="tabpanel"></div>
    </section>
  </div>
</div>
<div id="modal" hidden><div class="parch" role="dialog" aria-modal="true" id="parch"></div></div>

<script>
(() => {
"use strict";

/* ================= Données (faits vérifiés) ================= */
const ERAS = [
  { name: "Ère des Carolingiens", short: "Xᵉ siècle",
    monument: { name: "Résidence royale", cost: 1.5e4, desc: "La demeure des rois sur la butte. Bonus permanent : production ×1,5." },
    chron: { title: "La cité des rois", text: "Au Xᵉ siècle, la cité perchée fut la place forte des derniers rois carolingiens, qui en firent l'une de leurs principales résidences." },
    sky: { dayTop: [74, 112, 170], dayBot: [226, 186, 140] } },
  { name: "Ère des Bâtisseurs", short: "XIIᵉ – XIIIᵉ siècles",
    monument: { name: "Cathédrale Notre-Dame", cost: 6e6, desc: "L'une des premières grandes cathédrales gothiques. Bonus permanent : production ×1,5." },
    chron: { title: "Les bœufs de la cathédrale", text: "La cathédrale Notre-Dame fut bâtie aux XIIᵉ et XIIIᵉ siècles avec le calcaire tiré de la butte. Selon la légende, un bœuf providentiel aida à hisser les pierres : des bœufs sculptés veillent depuis au sommet des tours." },
    sky: { dayTop: [88, 128, 186], dayBot: [236, 200, 150] } },
  { name: "Ère des Remparts", short: "XIIIᵉ – XVIIᵉ siècles",
    monument: { name: "Citadelle", cost: 4e9, desc: "La forteresse voulue par Henri IV. Bonus permanent : production ×1,5." },
    chron: { title: "La Montagne couronnée", text: "Des remparts ponctués de portes, comme celles d'Ardon, des Chenizelles et de Soissons, ceinturent encore la ville haute. Après avoir assiégé Laon en 1594, Henri IV y fit bâtir une citadelle." },
    sky: { dayTop: [96, 120, 160], dayBot: [230, 180, 130] } },
  { name: "Ère moderne", short: "XIXᵉ – XXIᵉ siècles",
    monument: { name: "Fête de la Montagne couronnée", cost: 1.5e12, desc: "Mille ans d'histoire célébrés sur la butte. Ouvre le couronnement (prestige)." },
    chron: { title: "Du train au POMA", text: "Le train dépose désormais les voyageurs au pied de la butte. De 1989 à 2016, le POMA 2000, une petite rame automatique tirée par câble, reliait la gare à la ville haute." },
    sky: { dayTop: [80, 120, 180], dayBot: [240, 196, 160] } }
];
const FINAL = { title: "La cité couronnée", text: "En picard, une creute est une carrière souterraine. Sous tes pieds, des siècles de galeries ont fourni la pierre de toute la ville. Pendant la Grande Guerre, des soldats vécurent dans celles du Chemin des Dames, tout près de Laon." };

const BLD = [
  { id: "masure", era: 0, L: "M", name: "Masure", cost: 15, prod: 0.5, desc: "Une famille s'installe sur la butte." },
  { id: "puits", era: 0, L: "P", name: "Puits", cost: 100, prod: 4, desc: "Creusé dans le roc pour abreuver le quartier." },
  { id: "marche", era: 0, L: "M", name: "Marché", cost: 700, prod: 25, desc: "Marchands et pèlerins gravissent la butte." },
  { id: "guet", era: 0, L: "T", name: "Tour de guet", cost: 4000, prod: 120, def: 1, desc: "Perchée, la cité voit venir l'ennemi de loin." },
  { id: "creute", era: 1, L: "C", name: "Creute", cost: 2e4, prod: 600, desc: "Carrière souterraine : le calcaire de la butte devient pierre de taille." },
  { id: "tailleurs", era: 1, L: "A", name: "Atelier de tailleurs", cost: 1.2e5, prod: 3200, desc: "Les compagnons gravent leur marque sur chaque bloc." },
  { id: "boeufs", era: 1, L: "B", name: "Attelage de bœufs", cost: 7e5, prod: 17000, desc: "Selon la légende, un bœuf providentiel aida à hisser les pierres." },
  { id: "commanderie", era: 1, L: "T", name: "Commanderie du Temple", cost: 4.5e6, prod: 90000, desc: "Installés vers 1128, les Templiers bâtissent une chapelle octogonale." },
  { id: "porte", era: 2, L: "P", name: "Porte fortifiée", cost: 4e7, prod: 5e5, def: 4, desc: "Ardon, Chenizelles, Soissons : les portes gardent la ville haute." },
  { id: "hotel", era: 2, L: "H", name: "Hôtel particulier", cost: 2.5e8, prod: 2.6e6, desc: "Jacques Marquette, l'explorateur du Mississippi, naquit à Laon en 1637 dans une famille de notables." },
  { id: "remparts", era: 2, L: "R", name: "Rempart", cost: 1.6e9, prod: 1.4e7, def: 10, desc: "Une ceinture de murailles couronne la butte." },
  { id: "gare", era: 3, L: "G", name: "Gare", cost: 1.2e10, prod: 8e7, desc: "Le train dépose les voyageurs au pied de la butte." },
  { id: "poma", era: 3, L: "P", name: "Cabine POMA", cost: 8e10, prod: 4.5e8, desc: "De 1989 à 2016, une rame sur câble montait à la ville haute." },
  { id: "musee", era: 3, L: "M", name: "Musée", cost: 5e11, prod: 2.6e9, desc: "Les visiteurs viennent admirer mille ans d'histoire." }
];
const TIERS = [
  { need: 1, mult: 10, name: "Outils de fer" },
  { need: 5, mult: 50, name: "Savoir des compagnons" },
  { need: 25, mult: 500, name: "Runes de prospérité" },
  { need: 50, mult: 5000, name: "Bénédiction du Bœuf" }
];
const CLICK_UPG = [
  { id: "c1", cost: 100, name: "Marteau de tailleur", desc: "Chaque toucher rapporte le double.", base: 2 },
  { id: "c2", cost: 5e3, name: "Ciseau de compagnon", desc: "Chaque toucher rapporte en plus 1 % de la production par seconde.", pct: 0.01 },
  { id: "c3", cost: 5e5, name: "Gants runiques", desc: "Encore +2 % de la production par seconde par toucher.", pct: 0.02 },
  { id: "c4", cost: 5e7, name: "Main du maître d'œuvre", desc: "Encore +3 % de la production par seconde par toucher.", pct: 0.03 },
  { id: "c5", cost: 5e9, name: "Sceau royal", desc: "La valeur de base du toucher est multipliée par 5.", base: 5 }
];
const UPGRADES = [];
for (const b of BLD) TIERS.forEach((t, i) => UPGRADES.push({ id: `${b.id}-${i}`, b: b.id, need: t.need, cost: b.cost * t.mult, name: t.name, desc: `${b.name} : production ×2.`, L: b.L, era: b.era }));

/* ================= Raids de pillards (tower defense) ================= */
function roadPts(g) { return [[-10, g.y0 + 2], [W * 0.02, g.y0], [W * 0.16, g.y0 - (g.y0 - g.py) * 0.35], [W * 0.08, g.y0 - (g.y0 - g.py) * 0.68], [g.pl + 2 * g.u, g.py]]; }
function alongRoad(g, f) {
  const r = roadPts(g), L = r.slice(1).map((p, i) => Math.hypot(p[0] - r[i][0], p[1] - r[i][1])), tot = L.reduce((a, b) => a + b, 0);
  let s = clamp01(f) * tot, k = 0; while (k < L.length - 1 && s > L[k]) { s -= L[k]; k++; }
  const a = r[k], b = r[k + 1], q = s / L[k]; return { x: a[0] + (b[0] - a[0]) * q, y: a[1] + (b[1] - a[1]) * q, dir: Math.sign(b[0] - a[0]) || 1 };
}
const clamp01 = v => Math.max(0, Math.min(1, v));
const raid = { foes: [], arrows: [], wave: 0, next: 0, leaked: 0, slain: 0, live: false, fire: 0 };
function resetRaid() { raid.foes = []; raid.arrows = []; raid.live = false; raid.wave = 0; scheduleRaid(G.era >= 1 ? 45000 : 1e12); }
function scheduleRaid(delay) { raid.next = performance.now() + delay; }
scheduleRaid(G.era >= 1 ? 45000 : 1e12);
function startRaid() {
  raid.wave++; raid.live = true; raid.leaked = 0; raid.slain = 0;
  const n = 3 + Math.min(6, raid.wave), hp = 9 * Math.pow(3.2, Math.max(0, G.era - 1)) * (1 + 0.2 * raid.wave);
  for (let i = 0; i < n; i++) raid.foes.push({ f: -i * 0.06, hp, max: hp, speed: 1 / (20 + Math.random() * 5), hitT: 0 });
  toast(`Des pillards montent à l'assaut : ${n} assaillants`);
}
function tapDamage() { return (2 + defense() * 0.4) * (G.stance === "main" ? 2 : 1); }
function hitFoe(x, y) {
  if (!raid.foes.length) return false;
  const g = geom(), R = Math.max(26, 14 * g.u);
  for (const f of raid.foes) {
    if (f.f < 0) continue;
    const p = alongRoad(g, f.f);
    if (Math.hypot(x - p.x, y - (p.y - 9 * g.u)) < R) {
      const d = tapDamage(); damageFoe(f, d);
      floats.push({ x: p.x, y: p.y - 14 * g.u, text: "−" + fmt(d), life: 30, bad: true });
      for (let i = 0; i < 5; i++) sparks.push({ x: p.x, y: p.y - 5 * g.u, vx: (Math.random() - 0.5) * 4, vy: -Math.random() * 3, life: 20 });
      return true;
    }
  }
  return false;
}
function damageFoe(f, d) {
  if (f.hp <= 0) return;
  f.hp -= d; f.hitT = 0.15;
  if (f.hp <= 0) {
    const bounty = basePps() * 6 + 5; earn(bounty); raid.slain++; G.foesSlain++;
    const p = alongRoad(geom(), f.f); floats.push({ x: p.x, y: p.y - 20, text: "+" + fmt(bounty), life: 50, crit: true });
  }
}
function updateRaid(dt, now) {
  if (!raid.live) { if (G.era >= 1 && now > raid.next && modal.hidden) startRaid(); return; }
  const g = geom();
  for (const f of raid.foes) {
    if (f.hp <= 0) continue;
    f.f += f.speed * dt; f.hitT = Math.max(0, f.hitT - dt);
    if (f.f >= 1) {
      f.hp = 0; raid.leaked++;
      const loss = Math.min(G.deniers * 0.04, basePps() * 45); G.deniers -= loss;
      floats.push({ x: g.pl + 10, y: g.py - 20, text: "Pillage −" + fmt(loss), life: 70, bad: true });
    }
  }
  // tirs des tours
  const D = defense();
  if (D > 0) {
    raid.fire += dt * 3;
    while (raid.fire >= 1) {
      raid.fire -= 1;
      const targets = raid.foes.filter(f => f.hp > 0 && f.f >= 0 && f.f < 1);
      if (!targets.length) break;
      const tgt = targets.reduce((a, b) => (b.f > a.f ? b : a));
      const shooters = towerSpots(g); const sp = shooters[Math.floor(Math.random() * shooters.length)];
      raid.arrows.push({ x0: sp[0], y0: sp[1], foe: tgt, t: 0, dmg: D * 0.6 / 3 });
    }
  }
  for (const a of raid.arrows) { a.t += dt / 0.35; if (a.t >= 1 && !a.done) { a.done = true; damageFoe(a.foe, a.dmg); } }
  raid.arrows = raid.arrows.filter(a => !a.done);
  raid.foes = raid.foes.filter(f => f.hp > 0);
  if (!raid.foes.length) {
    raid.live = false; raid.arrows = [];
    if (raid.leaked === 0) { G.raidsWon++; addBuff({ name: "Victoire", kind: "prod", mult: 1.5, left: 60 }); toast("Assaut repoussé ! Production ×1,5 pendant 60 s"); }
    else toast(`Assaut terminé : ${raid.slain} pillards abattus, ${raid.leaked} ont pillé la cité`);
    scheduleRaid(100000 + Math.random() * 60000);
    if (tab === "c") render();
  }
}
function towerSpots(g) {
  const span = g.pr - g.pl, pts = [];
  [0.04, 0.66, 0.99].slice(0, Math.min(3, owned("guet"))).forEach(f => pts.push([g.pl + span * f, g.py - 26 * g.u]));
  if (owned("porte") > 0) pts.push([g.pl - 2 * g.u, g.py - 14 * g.u]);
  if (G.era >= 3) pts.push([g.pl + span * 0.93, g.py - 14 * g.u]);
  if (!pts.length) pts.push([g.pl + 4 * g.u, g.py - 8 * g.u]);

}
function drawRaid(g, n) {
  const u = g.u * 1.7;
  for (const a of raid.arrows) {
    const p = alongRoad(g, a.foe.f), tx = p.x, ty = p.y - 5 * u, q = Math.min(1, a.t);
    const x = a.x0 + (tx - a.x0) * q, y = a.y0 + (ty - a.y0) * q - Math.sin(q * Math.PI) * 18 * u;
    const ang = Math.atan2(ty - a.y0, tx - a.x0);

    c.beginPath(); c.moveTo(x, y); c.lineTo(x - Math.cos(ang) * 6 * u, y - Math.sin(ang) * 6 * u); c.stroke();
  }
  for (const f of raid.foes) {
    if (f.f < 0) continue;
    const p = alongRoad(g, f.f), bob = Math.abs(Math.sin(f.f * 300)) * 1.2 * u;
    c.save(); c.translate(p.x, p.y - bob); c.scale(p.dir, 1);
    c.fillStyle = f.hitT > 0 ? "#ffefe0" : "#2b1d1a";
    c.fillRect(-1.6 * u, -7 * u, 3.2 * u, 6 * u);
    c.beginPath(); c.arc(0, -8.6 * u, 1.7 * u, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#9b3a26"; c.beginPath(); c.arc(2 * u, -4.5 * u, 2 * u, 0, Math.PI * 2); c.fill();
    c.strokeStyle = "#c9c2b0"; c.lineWidth = Math.max(1, u * 0.4); c.beginPath(); c.moveTo(-2 * u, -1 * u); c.lineTo(1.5 * u, -12 * u); c.stroke();
    c.restore();
    const w = 10 * u, r = Math.max(0, f.hp / f.max);
    c.fillStyle = "rgba(0,0,0,.6)"; c.fillRect(p.x - w / 2, p.y - 15 * u, w, 2 * u);

  }
}

function rollFavor() {

  const o = { F, rar, mult: m, dur, bld, sold: false };

}

    case "click": return (o.mult - 1) * cv * cps * o.dur;

  }
  const next = BLD.find(b => b.era === G.era + 1);
  if (next) list.appendChild(el(`<div class="row locked"><div class="lettrine">?</div><div class="txt"><div class="name">Bâtiments de l'${ERAS[next.era].name.replace("Ère ", "ère ")}</div><div class="desc">Ils se révèlent quand le monument est achevé.</div></div><div class="side"></div></div>`));
}
function renderUpg() {
  list.appendChild(el(`<p class="section-title">Marché aux faveurs · renouvelé dans <span data-countdown>${Math.ceil(market.refresh)}</span> s</p>`));
  market.offers.forEach((o, i) => {
    const r = el(`<button type="button" class="row favor${o.sold ? " sold" : ""}" data-f="${i}" style="border-color:${o.rar.color}" ${o.sold ? "disabled" : ""}><div class="lettrine" style="border-color:${o.rar.color}">${o.F.name[0]}</div><div class="txt"><div class="rar" style="color:${o.rar.color}">${o.rar.name}</div><div class="name">${o.F.name}</div><div class="desc">${o.F.fx(o.mult, o.bld).replace(".", ",")} pendant ${o.dur} s</div></div><div class="side"><div class="cost">${o.sold ? "Acquise" : fmt(o.cost)}</div></div></button>`);
    r.addEventListener("click", () => buyFavor(i)); list.appendChild(r);
  });
  list.appendChild(el(`<p class="section-title">Savoir-faire permanents</p>`));
  const ups = availableUpgrades();
  if (!ups.length) { list.appendChild(el(`<p class="empty">Aucune amélioration pour l'instant. Construis davantage : de nouveaux savoir-faire apparaîtront.</p>`)); return; }
  for (const up of ups) {
    const r = el(`<button type="button" class="row" data-u="${up.id}"><div class="lettrine ${up.click ? "" : "era" + up.era}">${up.L}</div><div class="txt"><div class="name">${up.name}</div><div class="desc">${up.desc}</div></div><div class="side"><div class="cost">${fmt(up.cost)}</div></div></button>`);
    r.addEventListener("click", () => buyUpg(up)); list.appendChild(r);
  }
}
function renderChron() {
  const avail = reliquesAvailable();
  list.appendChild(el(`<p class="section-title">Registre</p>`));
  list.appendChild(el(`<div class="stats">
    <div class="stat"><span>Gagnés (cette cité)</span><b>${fmt(G.run)}</b></div>
    <div class="stat"><span>Gagnés (au total)</span><b>${fmt(G.life)}</b></div>
    <div class="stat"><span>Touchers</span><b>${fmt(G.clicks)}</b></div>
    <div class="stat"><span>Feux follets</span><b>${G.wispsCaught}</b></div>
    <div class="stat"><span>Défense</span><b>${fmt(defense())}</b></div>
    <div class="stat"><span>Assauts repoussés</span><b>${G.raidsWon}</b></div>
    <div class="stat"><span>Pillards abattus</span><b>${G.foesSlain}</b></div>
    <div class="stat"><span>Reliques</span><b>${G.reliques} (+${G.reliques * 10} %)</b></div>
  </div>`));
  list.appendChild(el(`<p class="section-title">Chronique de Laon</p>`));
  ERAS.forEach((e, i) => {
    const open = G.era > i || G.crowns > 0;
    list.appendChild(el(open ? `<div class="chron"><h3>${e.chron.title}</h3><p>${e.chron.text}</p></div>` : `<div class="chron locked"><h3>${e.name} · ${e.short}</h3><p>Page encore scellée. Achève le monument de cette ère pour la lire.</p></div>`));
  });
  list.appendChild(el(G.crowns > 0 ? `<div class="chron"><h3>${FINAL.title}</h3><p>${FINAL.text}</p></div>` : `<div class="chron locked"><h3>Dernière page</h3><p>Se révèle au premier couronnement.</p></div>`));
  list.appendChild(el(`<p class="section-title">Couronnement</p>`));
  const pr = el(`<div class="chron"><p>${G.era >= 4 ? `Couronner la cité recommence tout depuis la première masure, mais t'offre <b>${avail}</b> relique${avail > 1 ? "s" : ""}. Chaque relique ajoute 10 % de production pour toujours.` : "Achève la Fête de la Montagne couronnée pour pouvoir couronner la cité et gagner des reliques."}</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button type="button" class="btn" id="crown" ${G.era >= 4 ? "" : "disabled"}>Couronner la cité</button><button type="button" class="btn danger" id="wipe">Effacer la partie</button></div></div>`);
  list.appendChild(pr);
  pr.querySelector("#crown").addEventListener("click", crown);
  const wipe = pr.querySelector("#wipe");
  wipe.addEventListener("click", () => {
    if (wipe.dataset.armed) { try { localStorage.removeItem(KEY); } catch (e) {} G = fresh(); resetRaid(); active = []; hint.hidden = false; render(); renderEra(); toast("Partie effacée"); }
    else { wipe.dataset.armed = "1"; wipe.textContent = "Confirmer l'effacement"; setTimeout(() => { if (wipe.isConnected) { delete wipe.dataset.armed; wipe.textContent = "Effacer la partie"; } }, 4000); }
  });
}
function reliquesAvailable() { return Math.max(1, Math.floor(Math.sqrt(G.run / 1e11))); }

function refundOf(b, n) { const k = owned(b.id); n = Math.min(n, k); return 0.5 * b.cost * Math.pow(R, k - n) * (Math.pow(R, n) - 1) / (R - 1); }
function buy(b) {
  if (mode === "sell") {
    const n = Math.min(owned(b.id), qty === "max" ? owned(b.id) : qty); if (n < 1) return;
    const g = refundOf(b, n); G.deniers += g; G.owned[b.id] = owned(b.id) - n; render(); return;
  }
  const n = qty === "max" ? maxBuy(b) : qty; if (n < 1) return;
  const cost = costOf(b, n); if (cost > G.deniers) return;
  G.deniers -= cost; G.owned[b.id] = owned(b.id) + n;
  const before = availableUpgrades().length;
  render(); if (availableUpgrades().length > before) toast("Nouvelle amélioration disponible");
}
function buyUpg(up) {
  if (up.cost > G.deniers) return; G.deniers -= up.cost; G.upg.push(up.id); render();
}
function buyMonument() {
  const m = ERAS[G.era].monument; if (m.cost > G.deniers) return;
  G.deniers -= m.cost; const e = ERAS[G.era]; G.era++;
  if (G.era === 1) { scheduleRaid(45000); toast("Ta richesse attire les pillards : renforce tours, portes et remparts"); }
  for (let i = 0; i < 40; i++) sparks.push({ x: W / 2 + (Math.random() - 0.5) * W * 0.4, y: H * 0.4, vx: (Math.random() - 0.5) * 6, vy: -Math.random() * 5, life: 50 });
  save(); render(); renderEra();
  const nextEra = ERAS[G.era];
  modalShow({
    eyebrow: `${m.name} achevé`, title: e.chron.title,
    body: `<p>${e.chron.text}</p>${nextEra ? `<p class="note">Une nouvelle époque commence : ${nextEra.name} (${nextEra.short}). De nouveaux bâtiments sont disponibles.</p>` : `<p class="note">La cité est à son apogée. Dans la Chronique, tu peux désormais la couronner pour gagner des reliques.</p>`}`,
    choices: [{ label: "Poursuivre", on: modalHide }]
  });
}
function crown() {
  if (G.era < 4) return;
  const gain = reliquesAvailable();
  modalShow({
    eyebrow: "Couronnement", title: "Couronner la cité ?",
    body: `<p>La cité retournera à sa première masure. Tu gardes tes reliques et en gagnes <b>${gain}</b>, soit +${gain * 10} % de production en plus, pour toujours.</p>`,
    choices: [
      { label: "Couronner", on: () => {
        const keep = { reliques: G.reliques + gain, crowns: G.crowns + 1, life: G.life, clicks: G.clicks, wispsCaught: G.wispsCaught, raidsWon: G.raidsWon, foesSlain: G.foesSlain, stance: G.stance };
        G = Object.assign(fresh(), keep); resetRaid(); active = []; save(); render(); renderEra();
        modalShow({ eyebrow: "Dernière page de la chronique", title: FINAL.title, body: `<p>${FINAL.text}</p>`, choices: [{ label: "Rebâtir la cité", on: modalHide }] });
      } },
      { label: "Pas encore", sec: true, on: modalHide }
    ]
  });
}

/* ================= Rafraîchissement ================= */
const $amt = document.getElementById("amt"), $pps = document.getElementById("pps"), $pc = document.getElementById("perClick"), $buffs = document.getElementById("buffs");
function refreshNumbers() {
  $amt.firstChild.nodeValue = fmt(G.deniers); $pps.textContent = fmt(pps()); $pc.textContent = fmt(clickValue());
  if (tab === "b") {
    list.querySelectorAll("[data-b]").forEach(r => {
      const b = BLD.find(x => x.id === r.dataset.b);
      if (mode === "sell") {
        const n = Math.min(owned(b.id), qty === "max" ? owned(b.id) : qty);
        r.querySelector(".cost").textContent = n > 0 ? `Vendre ×${n} · +${fmt(refundOf(b, n))}` : "Rien à vendre";
        r.classList.add("selling"); r.classList.toggle("poor", n < 1);
      } else {
        const n = qty === "max" ? Math.max(1, maxBuy(b)) : qty, cost = costOf(b, n);
        r.querySelector(".cost").textContent = `${qty === "max" || qty > 1 ? `×${n} · ` : ""}${fmt(cost)}`;
        r.classList.remove("selling"); r.classList.toggle("poor", cost > G.deniers);
      }
    });
    const m = list.querySelector("[data-mon]");
    if (m && G.era < 4) { const cost = ERAS[G.era].monument.cost; m.classList.toggle("poor", cost > G.deniers); m.querySelector(".prog i").style.width = `${Math.min(100, G.deniers / cost * 100)}%`; }
  } else if (tab === "u") {
    list.querySelectorAll("[data-u]").forEach(r => { const up = UPGRADES.find(x => x.id === r.dataset.u); r.classList.toggle("poor", up.cost > G.deniers); });
    list.querySelectorAll("[data-f]").forEach(r => { const o = market.offers[+r.dataset.f]; if (o && !o.sold) r.classList.toggle("poor", o.cost > G.deniers); });
    const cd = list.querySelector("[data-countdown]"); if (cd) cd.textContent = Math.ceil(market.refresh);
  }
  const ups = availableUpgrades(), canU = ups.some(u => u.cost <= G.deniers) || market.offers.some(o => !o.sold && o.cost <= G.deniers);
  const tu = document.getElementById("tab-u"); let dot = tu.querySelector(".dot");
  if (canU && !dot) tu.insertAdjacentHTML("beforeend", '<span class="dot" aria-hidden="true"></span>'); else if (!canU && dot) dot.remove();
  refreshBuffs(); syncStance();
}
function refreshBuffs() {
  const kindTxt = b => b.kind === "prod" ? `Production ×${b.mult}` : b.kind === "click" ? `Toucher ×${b.mult}` : b.kind === "bld" ? `${BLD.find(x => x.id === b.bld).name} ×${b.mult}` : b.kind === "crit" ? `+${Math.round(b.mult * 100)} % coups de maître` : `Défense ×${b.mult}`;
  let h = active.map(b => `<div class="buff">${kindTxt(b).replace(".", ",")} · ${Math.ceil(b.left)} s<span class="bar" style="width:${(b.left / b.total) * 100}%"></span></div>`).join("");
  if (raid.live) h += `<div class="buff def">Assaut : ${raid.foes.filter(f => f.hp > 0).length} pillards · défense ${fmt(defense())}</div>`;
  $buffs.innerHTML = h;
}
function refreshAll() { render(); }
function renderEra() { document.getElementById("eraLabel").textContent = G.era < 4 ? `${ERAS[G.era].name} · ${ERAS[G.era].short}` : "Cité couronnée"; }

/* ================= Parchemin ================= */
const modal = document.getElementById("modal"), parch = document.getElementById("parch");
function modalShow({ eyebrow = "", title, body = "", choices = [] }) {
  parch.innerHTML = `${eyebrow ? `<p class="eyebrow">${eyebrow}</p>` : ""}<h2>${title}</h2>${body}<div class="choices"></div>`;
  const box = parch.querySelector(".choices");
  choices.forEach(ch => { const b = document.createElement("button"); b.type = "button"; b.textContent = ch.label; if (ch.sec) b.className = "sec"; b.addEventListener("click", ch.on); box.appendChild(b); });
  modal.hidden = false; setTimeout(() => box.querySelector("button")?.focus(), 30);
}
function modalHide() { modal.hidden = true; }

/* ================= Boucle ================= */
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(1, (now - last) / 1000); last = now;
  earn(pps() * dt);
  for (const b of active) b.left -= dt;
  if (active.some(b => b.left <= 0)) active = active.filter(b => b.left > 0);
  stanceCd = Math.max(0, stanceCd - dt);
  market.refresh -= dt; if (market.refresh <= 0) restockMarket();
  updateRaid(dt, now);
  if (!wisp && now > nextWisp) { spawnWisp(now); nextWisp = now + 50000 + Math.random() * 70000; }
  acc += dt; if (acc > 0.25) { acc = 0; refreshNumbers(); }
  if (W > 1) drawScene(now);
  requestAnimationFrame(frame);
}
// rattrapage quand l'onglet revient au premier plan
addEventListener("visibilitychange", () => { if (!document.hidden) { const away = (performance.now() - last) / 1000; if (away > 1) earn(basePps() * Math.min(away, 8 * 3600)); last = performance.now(); } });

resize(); render(); renderEra();
if (offlineGain > 1) modalShow({ eyebrow: "Pendant ton absence", title: "La cité a travaillé", body: `<p>Tes gens ont amassé <b>${fmt(offlineGain)}</b> deniers en ton absence (à mi-régime, jusqu'à 8 heures).</p>`, choices: [{ label: "Reprendre", on: modalHide }] });
else if (G.life === 0) modalShow({ eyebrow: "Laon, Xᵉ siècle", title: "La Cité perchée", body: `<p>Sur une butte de calcaire dominant la plaine, quelques familles s'installent. À toi de faire de ce rocher une cité royale, puis une ville que les siècles n'effaceront pas.</p><p class="note">Touche la cité pour récolter des deniers, bâtis pour qu'elle produise seule, guette les feux follets dorés et les faveurs du marché. Choisis ton orientation : labeur pour toucher, intendance pour laisser produire.</p>`, choices: [{ label: "Fonder la cité", on: modalHide }] });
requestAnimationFrame(frame);
})();
</script>
